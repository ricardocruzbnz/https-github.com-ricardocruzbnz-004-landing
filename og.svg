<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFEFD6"/>

  <!-- Marca -->
  <text x="80" y="118" font-family="Helvetica" font-size="46" font-weight="700"
        letter-spacing="-2" fill="#0E0E0E">004</text>
  <circle cx="171" cy="110" r="7" fill="#1F8FFF"/>

  <!-- Rótulo -->
  <rect x="80" y="242" width="34" height="3" fill="#1F8FFF"/>
  <text x="128" y="251" font-family="Helvetica" font-size="19" font-weight="700"
        letter-spacing="3" fill="#9F512D">AGENCIA DE MARKETING</text>

  <!-- Titular. Los fragmentos van en elementos separados con x calculado:
       el renderizador de macOS ignora los estilos de tspan. -->
  <g font-family="Helvetica" font-size="72" font-weight="700" letter-spacing="-2.6" fill="#0E0E0E">
    <text x="80" y="356">Marketing que se mide</text>
    <text x="80" y="444">en</text>
    <!-- skewX en lugar de font-style: el renderizador no resuelve la oblicua -->
    <text transform="translate(176,444) skewX(-10)" x="0" y="0"
          font-weight="400" fill="#9F512D">resultados</text>
    <text x="490" y="444">,</text>
    <text x="80" y="532">no en impresiones.</text>
  </g>
</svg>
