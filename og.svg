<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F0EADA"/>

  <!-- Marca -->
  <text x="80" y="118" font-family="Helvetica" font-size="46" font-weight="700"
        letter-spacing="-2" fill="#533C36">004</text>
  <circle cx="171" cy="110" r="7" fill="#855C4C"/>

  <!-- Rótulo -->
  <rect x="80" y="248" width="34" height="3" fill="#855C4C"/>
  <text x="128" y="257" font-family="Helvetica" font-size="19" font-weight="700"
        letter-spacing="3" fill="#855C4C">AGENCIA DE MARKETING &#183; GUADALAJARA</text>

  <!-- Eslogan. Los fragmentos van en elementos separados con x calculado:
       el renderizador de macOS ignora los estilos de tspan, y la cursiva
       se consigue con skewX porque tampoco resuelve la variante oblicua. -->
  <g font-family="Helvetica" font-size="76" font-weight="700" letter-spacing="-2.8" fill="#533C36">
    <text x="80" y="380">Marcas memorables.</text>
    <text x="80" y="474">Negocios que</text>
    <text transform="translate(563,474) skewX(-10)" x="0" y="0"
          font-weight="400" fill="#855C4C">trascienden</text>
    <text x="932" y="474">.</text>
  </g>
</svg>
